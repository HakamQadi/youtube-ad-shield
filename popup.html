<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ad Shield for YouTube™</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <header class="brand">
      <img class="brand-icon" src="icons/icon128.png" width="56" height="56" alt="" />
      <div class="brand-copy">
        <h1>Ad Shield for YouTube™</h1>
        <p>Ads + creator sponsor skipping</p>
      </div>
    </header>

    <label class="status-card" for="enabledToggle">
      <span class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 2.6 19 5.5v5.6c0 4.6-2.8 8.4-7 10.3-4.2-1.9-7-5.7-7-10.3V5.5L12 2.6Z" />
          <path class="status-check" d="m8.6 12.1 2.1 2.1 4.8-5" />
        </svg>
      </span>

      <span class="status-copy">
        <strong id="statusTitle">Shield is active</strong>
        <small id="statusText">Skipping YouTube ads</small>
      </span>

      <input id="enabledToggle" type="checkbox" aria-label="Enable Ad Shield for YouTube™" checked />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="feature-card" for="sponsorToggle">
      <span class="feature-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M5 7h14v10H5z" />
          <path d="m10 9.5 4.5 2.5-4.5 2.5z" />
          <path d="m4 4 16 16" />
        </svg>
      </span>

      <span class="feature-copy">
        <strong>Creator sponsorships</strong>
        <small>Auto-skip in-video sponsor segments</small>
        <em>Community data by SponsorBlock</em>
      </span>

      <input id="sponsorToggle" type="checkbox" aria-label="Skip creator sponsorship segments" checked />
      <span class="switch feature-switch" aria-hidden="true"></span>
    </label>

    <section class="stats-card" aria-label="Ad statistics">
      <div class="stats-main">
        <span class="stats-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="13" width="3" height="7" rx="1" />
            <rect x="10.5" y="9" width="3" height="11" rx="1" />
            <rect x="17" y="5" width="3" height="15" rx="1" />
          </svg>
        </span>
        <div>
          <span class="stats-label">Ads handled</span>
          <strong id="blockedCount">0</strong>
        </div>
      </div>

      <span class="stats-divider" aria-hidden="true"></span>

      <button id="resetStats" class="reset-button" type="button" aria-label="Reset ads handled counter">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.8 8.2A8 8 0 1 1 4 14" />
          <path d="M4.8 3.8v4.4h4.4" />
        </svg>
        <span>Reset</span>
      </button>
    </section>

    <section class="auto-card" aria-label="Automatic protection status">
      <span class="check-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="m7.8 12.2 2.7 2.7 5.8-6" />
        </svg>
      </span>
      <span>Works automatically on YouTube</span>
    </section>

    <button id="reportAd" class="report-button" type="button">
      <span class="report-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 3 2.8 19h18.4L12 3Z" />
          <path d="M12 9v4.5" />
          <path d="M12 17h.01" />
        </svg>
      </span>
      <span class="report-copy">
        <strong>Report Ad Not Skipped</strong>
        <small>Open a pre-filled GitHub issue</small>
      </span>
      <svg class="report-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9 6 6 6-6 6" />
      </svg>
    </button>

    <footer class="footer">
      <span>Powered By</span>
      <a
        id="authorLink"
        href="https://hakamportfolio.netlify.app/"
        target="_blank"
        rel="noopener noreferrer"
        title="Open Hakam Qadi's portfolio"
      >
        Hakam Qadi
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 5h5v5" />
          <path d="m19 5-8 8" />
          <path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
        </svg>
      </a>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
